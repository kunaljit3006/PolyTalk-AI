name: Deploy Backend to Hugging Face

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Clone the Hugging Face Space
          git clone https://huggingface.co/spaces/heykunal123/polytalk-ai-backend hf_space
          
          # Sync the contents of the backend folder into the Space root
          # This ensures main.py and requirements.txt are at the root level where HF expects them
          rsync -av --delete --exclude '.git' backend/ hf_space/
          
          # Commit and Push
          cd hf_space
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          # Fix for Hugging Face Fine-Grained Tokens: username must be oauth2 or user
          git remote set-url origin https://user:$HF_TOKEN@huggingface.co/spaces/heykunal123/polytalk-ai-backend
          git add .
          
          # If there are changes, commit and push them
          if ! git diff --staged --quiet; then
            git commit -m "Auto-deploy backend from GitHub Actions"
            echo "Pushing to Hugging Face..."
            git push origin main || { echo "Git Push Failed! Did you add the HF_TOKEN secret correctly?"; exit 1; }
          else
            echo "No changes to deploy."
          fi
